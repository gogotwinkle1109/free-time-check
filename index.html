<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f3ef" />
<meta name="robots" content="noindex, nofollow" />
<title>自由时间 · 状态检查</title>

<!-- 云端配置（Supabase） -->
<script>
  window.FT_CLOUD = {
    url: "https://emswjwumxxxtbrrotvtn.supabase.co",
    key: "sb_publishable_AJutqSzjnO-su1I1Try2kA_0HE1gA3M"
  };
</script>

<style>
  *,*::before,*::after{box-sizing:border-box;}
  :root{
    --bg:#f4f3ef;--card:#ffffff;--ink:#1d1d1f;--ink-2:#55555c;--ink-3:#8e8e93;
    --line:#e6e4df;--hover:rgba(0,0,0,.035);
    --accent:#2f6b57;--accent-ink:#ffffff;--accent-soft:#e9f2ed;
    --radius:16px;--shadow:0 1px 2px rgba(16,24,20,.05),0 10px 30px rgba(16,24,20,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#121214;--card:#1b1b1e;--ink:#f3f3f5;--ink-2:#b6b6be;--ink-3:#85858e;
      --line:#2b2b31;--hover:rgba(255,255,255,.045);
      --accent:#84c9ad;--accent-ink:#0d1a14;--accent-soft:#1e2b25;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
    }
  }
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding-bottom:calc(32px + env(safe-area-inset-bottom));
  }
  button,input,textarea,select{font-family:inherit;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
  .topbar-in{max-width:820px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.3px;white-space:nowrap;cursor:pointer;}
  .brand .mark{width:22px;height:22px;border-radius:7px;flex:0 0 auto;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
  .tabs{margin-left:auto;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .tab{appearance:none;border:0;background:transparent;color:var(--ink-2);font-size:14px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;min-height:32px;transition:background .15s,color .15s;}
  .tab.is-active{background:var(--accent);color:var(--accent-ink);}

  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 20px 22px;}
  .hero{margin:6px 0 18px;}
  .hero h1{font-size:24px;line-height:1.35;margin:0 0 8px;letter-spacing:.2px;}
  .hero p{margin:0;color:var(--ink-2);font-size:14.5px;}
  .hero .today{display:inline-block;margin-top:10px;font-size:13px;color:var(--ink-3);}

  /* 首页卡片 */
  .home-list{display:flex;flex-direction:column;gap:10px;}
  .home-card{
    display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
    padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);
    cursor:pointer;transition:transform .12s,box-shadow .15s,border-color .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .home-card:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--accent);}
  .home-card .ico{font-size:22px;line-height:1.3;flex:0 0 auto;}
  .home-card .body{flex:1 1 auto;min-width:0;}
  .home-card h3{margin:0 0 3px;font-size:16px;letter-spacing:.2px;}
  .home-card p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55;}
  .home-card .meta{margin-top:6px;font-size:12px;color:var(--ink-3);}
  .home-card .arrow{align-self:center;color:var(--ink-3);font-size:18px;flex:0 0 auto;}

  /* 问卷 */
  .survey-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back-btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:10px;padding:7px 12px;font-size:13.5px;cursor:pointer;min-height:36px;}
  .back-btn:hover{background:var(--hover);}
  .survey-tag{font-size:12.5px;color:var(--ink-3);}
  .survey-title{font-size:20px;margin:0 0 6px;line-height:1.4;}
  .survey-desc{margin:0 0 4px;font-size:14px;color:var(--ink-2);}

  .q{margin:0;}
  .q + .q{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);}
  .qtitle{display:flex;gap:8px;align-items:baseline;font-size:17px;font-weight:700;margin:0 0 10px;letter-spacing:.2px;line-height:1.45;}
  .qno{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:800;flex:0 0 auto;}
  .opts{display:flex;flex-direction:column;gap:2px;}
  .opt{display:flex;align-items:center;gap:13px;padding:12px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;min-height:48px;-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s;}
  @media (hover:hover){ .opt:hover{background:var(--hover);} }
  .opt.is-checked{background:var(--accent-soft);border-color:var(--accent);}
  .opt:focus-within{outline:2px solid var(--accent);outline-offset:2px;}
  .opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
  .dot{width:21px;height:21px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--ink-3);position:relative;transition:border-color .15s;}
  .opt input:checked ~ .dot{border-color:var(--accent);}
  .opt input:checked ~ .dot::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--accent);}
  .opt .txt{font-size:16px;line-height:1.45;}

  .other-wrap{margin:8px 0 0 34px;}
  .other-wrap input{
    width:100%;font:inherit;font-size:15.5px;padding:11px 13px;border-radius:11px;
    border:1px solid var(--accent);background:var(--bg);color:var(--ink);outline:none;
  }

  .q-free{margin-top:22px;padding:16px 16px 14px;border:1px dashed var(--line);border-radius:14px;background:var(--hover);}
  .q.q-free{border-top:0;}
  .q-free .qtitle{font-size:15.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px;}
  .q-free .qno{color:var(--ink-3);}
  .q-free textarea{background:var(--card);}

  /* ---- 分步引导 ---- */
  .wiz-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .wiz-right{margin-left:auto;text-align:right;}
  .wiz-steps{font-size:12.5px;color:var(--ink-3);}
  .wiz-bar{height:4px;width:170px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px;margin-left:auto;}
  .wiz-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s;}
  .wiz-title{font-size:20px;margin:0 0 6px;line-height:1.4;}
  .wiz-desc{margin:0 0 16px;font-size:14px;color:var(--ink-2);}
  .wiz-free{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);}
  .wiz-free label{display:block;font-size:13px;color:var(--ink-3);margin-bottom:6px;}
  .wiz-free textarea{min-height:76px;}
  .wiz-nav{display:flex;gap:10px;margin-top:18px;align-items:center;}
  .wiz-nav .btn{min-height:46px;}
  .cat{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;background:var(--card);transition:border-color .15s,background .15s;}
  .cat.rec{border-color:var(--accent);background:var(--accent-soft);}
  .cat-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:15.5px;-webkit-tap-highlight-color:transparent;}
  .cat-key{color:var(--accent);font-weight:800;}
  .cat-badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;}
  .cat-caret{margin-left:auto;color:var(--ink-3);font-size:13px;}
  .cat-body{margin-top:10px;display:flex;flex-direction:column;gap:2px;}
  .cat-body .opt{padding:10px 10px;min-height:44px;}
  .cat-body .opt .txt{font-size:15px;}
  .readonly-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:baseline;}
  .readonly-row:last-child{border-bottom:0;}
  .readonly-k{flex:0 0 74px;font-size:13px;color:var(--ink-3);}
  .readonly-v{font-size:15.5px;font-weight:600;}

  .text-fields{display:flex;flex-direction:column;gap:10px;}
  .tf{display:flex;gap:10px;align-items:flex-start;}
  .tf label{flex:0 0 76px;font-size:14px;color:var(--ink-2);padding-top:11px;font-weight:600;}
  .tf input,.tf textarea{flex:1 1 auto;width:100%;}
  input[type="text"],textarea{
    width:100%;font:inherit;font-size:16px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;outline:none;transition:border-color .15s;
  }
  input[type="text"]:focus,textarea:focus{border-color:var(--accent);}
  textarea{min-height:92px;resize:vertical;line-height:1.6;}
  textarea.tall{min-height:150px;}

  .jrn-section{padding:16px 0;border-top:1px solid var(--line);}
  .jrn-section:first-of-type{border-top:0;padding-top:0;}
  .jrn-title{font-size:16px;font-weight:700;margin:0 0 8px;}
  .jrn-hints{margin:0 0 10px;padding-left:18px;color:var(--ink-3);font-size:13px;line-height:1.7;}
  .jrn-hints li{margin:2px 0;}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;}
  .btn{appearance:none;font-size:15px;font-weight:600;line-height:1.2;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 18px;border-radius:12px;min-height:46px;cursor:pointer;transition:transform .08s,background .15s,opacity .15s;-webkit-tap-highlight-color:transparent;}
  .btn:active{transform:scale(.985);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{opacity:.92;}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn.sm{font-size:14px;padding:9px 13px;min-height:38px;border-radius:10px;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:#c0392b;border-color:var(--line);}
  @media (prefers-color-scheme:dark){ .btn.danger{color:#ff8a7a;} }
  .grow{flex:1 1 auto;}

  /* 记录 */
  .statline{margin:0 0 12px;color:var(--ink-2);font-size:14px;line-height:1.7;}
  .statline b{color:var(--ink);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;min-height:34px;white-space:nowrap;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .btn .sh{display:none;}

  .rec{border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .rec + .rec{margin-top:10px;}
  .rec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .rec-time{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .pill{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}
  .rec-del{margin-left:auto;appearance:none;border:0;background:transparent;color:var(--ink-3);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px;min-height:32px;}
  .rec-del:hover{background:var(--hover);color:#c0392b;}
  @media (prefers-color-scheme:dark){ .rec-del:hover{color:#ff8a7a;} }
  .qa-row{padding:9px 0;border-top:1px dashed var(--line);}
  .qa-row:first-child{border-top:0;padding-top:2px;}
  .qa-q{font-size:12.5px;color:var(--ink-3);margin-bottom:2px;line-height:1.5;}
  .qa-a{font-size:15px;font-weight:600;white-space:pre-wrap;word-break:break-word;line-height:1.55;}
  .empty{text-align:center;padding:48px 20px;color:var(--ink-3);font-size:14.5px;border:1px dashed var(--line);border-radius:14px;}
  .empty .emoji{font-size:28px;display:block;margin-bottom:10px;opacity:.7;}

  /* 口令 / 配置 */
  .gate-card{max-width:460px;margin:28px auto;}
  .gate-title{margin:0 0 8px;font-size:19px;display:flex;align-items:center;gap:8px;}
  .gate-sub{margin:0 0 16px;color:var(--ink-2);font-size:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:5px;font-weight:600;}
  .field .msg{font-size:12.5px;color:var(--ink-3);margin-top:5px;}
  .gate-form{display:flex;flex-direction:column;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin:2px 0 14px;cursor:pointer;}
  .checkline input{width:18px;height:18px;accent-color:var(--accent);}
  .gate-err{margin:10px 0 0;font-size:13.5px;color:#c0392b;min-height:20px;}
  @media (prefers-color-scheme:dark){ .gate-err{color:#ff8a7a;} }
  .linkbtn{appearance:none;border:0;background:transparent;color:var(--ink-3);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0;}

  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d1d1f;color:#fff;font-size:14px;padding:11px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:.22s;max-width:calc(100vw - 40px);text-align:center;z-index:60;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  @media (prefers-color-scheme:dark){ #toast{background:#f3f3f5;color:#111;} }
  footer{max-width:820px;margin:26px auto 0;padding:0 16px;font-size:12.5px;color:var(--ink-3);line-height:1.7;}
  .badge{display:inline-block;margin-top:8px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--hover);color:var(--ink-3);border:1px solid var(--line);}
  .badge.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent;}

  @media (max-width:520px){
    .wrap{padding:16px 14px 0;}
    .card{padding:16px 15px 18px;border-radius:14px;}
    .hero h1{font-size:21px;}
    .survey-title{font-size:18px;}
    .qtitle{font-size:16px;}
    .opt{padding:12px 8px;gap:12px;}
    .opt .txt{font-size:15.5px;}
    .other-wrap{margin-left:28px;}
    .tf{flex-direction:column;gap:4px;}
    .tf label{flex:none;padding-top:0;}
    .actions{gap:8px;}
    .actions .btn{width:100%;}
    .actions .btn.ghost{width:auto;flex:0 0 auto;margin-left:auto;font-size:14px;padding:10px 14px;min-height:40px;}
    .toolbar .btn{flex:1 1 calc(50% - 8px);}
    .toolbar .btn.sm{font-size:13.5px;padding:10px 6px;}
    .toolbar .btn .lg{display:none;}
    .toolbar .btn .sh{display:inline;}
    footer{padding:0 14px;}
    .gate-card{margin:14px auto;}
    .home-card{padding:14px;}
  }
  @media (max-width:400px){
    .topbar-in{height:52px;padding:0 12px;gap:8px;}
    .brand{font-size:14.5px;gap:6px;}
    .brand .mark{width:20px;height:20px;font-size:11px;border-radius:6px;}
    .tab{font-size:13px;padding:6px 12px;}
    .hero h1{font-size:20px;}
    .toolbar .btn.sm{font-size:13px;padding:9px 4px;}
  }
  @media print{
    body{background:#fff;}
    .topbar,.toolbar,.chips,#toast,.rec-del,.actions,footer,.back-btn{display:none !important;}
    .card,.rec{box-shadow:none;border-color:#ccc;}
    .wrap{padding:0;max-width:none;}
    #view-home,#view-survey,#view-result,#view-gate,#view-loading,#view-setup{display:none !important;}
    #view-records{display:block !important;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand" id="brandHome"><span class="mark">此</span>此刻 · 状态检查</div>
    <nav class="tabs" role="tablist" aria-label="页面切换">
      <button class="tab is-active" role="tab" data-view="home" aria-selected="true">检查</button>
      <button class="tab" role="tab" data-view="records" aria-selected="false">记录</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view-loading"><div class="empty">正在打开…</div></main>

<!-- 首次配置 -->
<main class="wrap" id="view-setup" hidden>
  <div class="card gate-card">
    <h2 class="gate-title">⚙️ 首次配置</h2>
    <p class="gate-sub">填入你自己的 Supabase 项目信息（免费），记录会加密后存在那里，手机和电脑共用同一份。</p>
    <form class="gate-form" id="setupForm" novalidate>
      <div class="field">
        <label for="cfgUrl">Supabase 项目 URL</label>
        <input type="text" id="cfgUrl" placeholder="https://xxxxxxxx.supabase.co" spellcheck="false" autocapitalize="off" />
      </div>
      <div class="field">
        <label for="cfgKey">anon / publishable key</label>
        <input type="text" id="cfgKey" placeholder="sb_publishable_... 或 eyJ..." spellcheck="false" autocapitalize="off" />
      </div>
      <div class="field">
        <label for="cfgPass">设定一个访问口令</label>
        <input type="password" id="cfgPass" placeholder="至少 4 位，忘记将无法恢复记录" autocomplete="new-password" />
        <div class="msg">这个口令同时是解密钥匙，只在你设备上参与计算，不会上传。</div>
      </div>
      <button class="btn primary" type="submit" id="setupBtn">保存并开始使用</button>
      <p class="gate-err" id="setupErr"></p>
      <button class="linkbtn" type="button" id="setupSkip">暂不配置，仅在本机使用（不同步）</button>
    </form>
  </div>
</main>

<!-- 口令 -->
<main class="wrap" id="view-gate" hidden>
  <div class="card gate-card">
    <h2 class="gate-title">🔒 输入访问口令</h2>
    <p class="gate-sub">口令用于解密你的记录。这台设备验证一次后会记住。</p>
    <form class="gate-form" id="gateForm" novalidate>
      <div class="field">
        <input type="password" id="gatePass" placeholder="访问口令" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" />
      </div>
      <label class="checkline"><input type="checkbox" id="rememberPass" checked /> 在这台设备记住口令</label>
      <button class="btn primary" type="submit" id="gateBtn">进入</button>
      <p class="gate-err" id="gateErr"></p>
      <button class="linkbtn" type="button" id="gateReset">重新配置 Supabase 连接</button>
    </form>
  </div>
</main>

<!-- 首页 -->
<main class="wrap" id="view-home" hidden>
  <div class="hero">
    <h1>选一个方向，先看清此刻</h1>
    <p>不需要每次都想清楚人生，只要在开始之前确认：我现在是什么状态、真正需要什么、打算怎么结束。</p>
    <span class="today" id="todayLabel"></span>
  </div>
  <div class="home-list" id="homeList"></div>
</main>

<!-- 问卷 -->
<main class="wrap" id="view-survey" hidden>
  <div class="survey-top">
    <button class="back-btn" type="button" id="backHome">← 返回</button>
    <span class="survey-tag" id="surveyTag"></span>
  </div>
  <div class="hero" style="margin-top:0;">
    <h1 class="survey-title" id="surveyTitle"></h1>
    <p class="survey-desc" id="surveyDesc"></p>
  </div>
  <form class="card" id="surveyForm" novalidate></form>
  <div class="actions">
    <button class="btn primary grow" type="button" id="submitBtn">提交并保存这次记录</button>
    <button class="btn ghost" type="button" id="btnResetSurvey">清空重填</button>
  </div>
</main>

<!-- 分步引导 -->
<main class="wrap" id="view-guided" hidden>
  <div class="wiz-head">
    <button class="back-btn" type="button" id="wizExit">← 退出</button>
    <div class="wiz-right">
      <div class="wiz-steps" id="wizSteps">第 1 步 / 共 5 步</div>
      <div class="wiz-bar"><i id="wizBar" style="width:20%"></i></div>
    </div>
  </div>
  <h2 class="wiz-title" id="wizTitle"></h2>
  <p class="wiz-desc" id="wizDesc"></p>

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  function readCfg(){
    if(BUILTIN) return BUILTIN;
    try{
      var j = JSON.parse(lsGet(CFG_KEY) || "null");
      if(j && j.url && j.key) return j;
    }catch(e){}
    return null;
  }
  function localRead(){
    try{ var a = JSON.parse(lsGet(LOCAL_KEY) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }
  function localWrite(list){ return lsSet(LOCAL_KEY, JSON.stringify(list)); }

  /* ================= 加解密 ================= */
  function b64(buf){
    var bytes = new Uint8Array(buf), s = "";
    for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function unb64(str){
    var bin = atob(str), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function hasCrypto(){ return !!(window.crypto && window.crypto.subtle && window.TextEncoder); }
  function deriveKey(pass){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey(
        { name:"PBKDF2", salt: enc.encode("ft-check-salt-v1"), iterations: 150000, hash:"SHA-256" },
        base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]
      );
    });
  }
  function encryptObj(key, obj){
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name:"AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)))
      .then(function(ct){ return b64(iv) + "." + b64(ct); });
  }
  function decryptObj(key, cipher){
    var parts = String(cipher || "").split(".");
    if(parts.length !== 2) return Promise.reject(new Error("bad cipher"));
    return crypto.subtle.decrypt({ name:"AES-GCM", iv: unb64(parts[0]) }, key, unb64(parts[1]))
      .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); });
  }

  /* ================= Supabase ================= */
  function sbFetch(cfg, path, opts){
    opts = opts || {};
    var base = String(cfg.url || "").replace(/\/+$/, "");
    var headers = { "apikey": cfg.key, "Authorization": "Bearer " + cfg.key, "Content-Type": "application/json" };
    if(opts.prefer) headers["Prefer"] = opts.prefer;
    return fetch(base + "/rest/v1/" + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: "no-store"
    }).then(function(res){
      return res.text().then(function(text){
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch(e) {}
        if(!res.ok){
          var err = new Error((data && (data.message || data.hint)) || ("HTTP " + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }
  function cloudList(){
    return sbFetch(state.cfg, "ft_records?select=id,created_at,cipher&order=created_at.desc&limit=3000")
      .then(function(rows){
        rows = rows || [];
        if(!rows.length) return { total:0, records:[] };
        var jobs = rows.map(function(row){
          return decryptObj(state.key, row.cipher).then(function(obj){
            obj.id = row.id;
            if(!obj.ts) obj.ts = row.created_at;
            return obj;
          }).catch(function(){ return null; });
        });
        return Promise.all(jobs).then(function(list){
          var ok = list.filter(function(x){ return x; }).map(normalize);
          ok.sort(function(a,b){ return String(b.ts).localeCompare(String(a.ts)); });
          return { total: rows.length, records: ok };
        });
      });
  }
  // 兼容早期三问结构的旧记录
  function normalize(r){
    if(r && r.answers) {
      if(!r.type) r.type = "legacy";
      if(!r.typeLabel) r.typeLabel = TYPE_LABEL[r.type] || "记录";
      return r;
    }
    var answers = [];
    if(r.want) answers.push({ q:"1. 我现在真正想要的是什么？", a:r.want });
    if(r.invest) answers.push({ q:"2. 我打算给这件事多少投入？", a:r.invest });
    if(r.end) answers.push({ q:"3. 结束时，我希望自己是什么状态？", a:r.end });
    if(r.note) answers.push({ q:"备注", a:r.note });
    return { id:r.id, ts:r.ts, type:"legacy", typeLabel:"早期三问", answers:answers };
  }
  function cloudAdd(entry){
    return encryptObj(state.key, entry).then(function(cipher){
      return sbFetch(state.cfg, "ft_records", { method:"POST", body:[{ cipher: cipher }], prefer:"return=minimal" });
    }).then(function(){ return cloudList(); }).then(function(r){
      state.records = r.records;
      return state.records[0] || entry;
    });
  }
  function cloudDel(id){
    return sbFetch(state.cfg, "ft_records?id=eq." + encodeURIComponent(id), { method:"DELETE" })
      .then(function(){ return cloudList(); })
      .then(function(r){ state.records = r.records; });
  }
  function cloudClear(){
    return sbFetch(state.cfg, "ft_records?id=not.is.null", { method:"DELETE" })
      .then(function(){ state.records = []; });
  }

  /* ================= 工具 ================= */
  var WD = ["周日","周一","周二","周三","周四","周五","周六"];
  function pad(n){ return String(n).length < 2 ? "0" + n : String(n); }
  function fmtLong(iso){
    var d = new Date(iso);
    if(isNaN(d)) return iso || "";
    return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+WD[d.getDay()]+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  function fmtStamp(iso){
    var d = new Date(iso);
    if(isNaN(d)) return iso || "";
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  function fileStamp(){
    var d = new Date();
    return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes());
  }
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2800);
  }

  /* ================= 视图 ================= */
  var ALL_VIEWS = ["loading","setup","gate","home","survey","guided","result","records"];
  function hideAll(){
    ALL_VIEWS.forEach(function(v){
      var el = document.getElementById("view-" + v);
      if(el) el.hidden = true;
    });
  }
  function switchView(name){
    hideAll();
    var el = document.getElementById("view-" + name);
    if(el) el.hidden = false;
    var top = (name === "records") ? "records" : "home";
    var tabs = document.querySelectorAll(".tab");
    for(var i=0;i<tabs.length;i++){
      var on = tabs[i].getAttribute("data-view") === top;
      tabs[i].classList.toggle("is-active", on);
      tabs[i].setAttribute("aria-selected", on ? "true" : "false");
    }
    try{ history.replaceState(null, "", "#" + name); }catch(err){}
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function setBadge(){
    var el = document.getElementById("syncBadge");
    if(state.mode === "cloud"){
      el.textContent = "☁ 云端同步已开启：手机与电脑共用同一份加密记录";
      el.className = "badge ok";
    }else{
      el.textContent = "本地模式：记录只存在这台设备（未连接云端）";
      el.className = "badge";

  /* ================= 首页 ================= */
  function counts(){
    var m = {};
    state.records.forEach(function(r){ m[r.type] = (m[r.type]||0)+1; });
    return m;
  }
  function qCount(s){
    if(s.guided) return 0;
    return s.questions.filter(function(q){ return !q.freeSlot; }).length;
  }
  function renderHome(){
    var m = counts();
    var html = SURVEYS.map(function(s){
      var n = m[s.id] || 0;
      var sizeText;
      if(s.guided) sizeText = "5 步 · 层层深入 · 每步可自由书写";
      else if(s.journal) sizeText = s.sections.length + " 个部分";

      return '<button class="home-card" type="button" data-survey="' + s.id + '">' +
        '<span class="ico">' + s.icon + '</span>' +

          '<h3>' + esc(s.title) + '</h3>' +
          '<p>' + esc(s.desc) + '</p>' +

  /* ================= 问卷渲染 ================= */
  var surveyForm = document.getElementById("surveyForm");

  function openSurvey(survey){
    if(survey.guided){ startGuided(); return; }
    state.current = survey;

    document.getElementById("surveyDesc").textContent = survey.desc;
    document.getElementById("surveyTag").textContent = survey.journal ? "自由书写" : (qCount(survey) + " 个问题 + 1 个留白");

  /* ================= 分步引导：逻辑 ================= */

      p2:{ cat:"", sub:"", subOther:"", tryText:"", free:"" },
      p3:{ action:"", time:"", endCond:"", free:"" },
      p4:{ exp:"", gain:"", gainOther:"", diff:"", state:"", ended:"", endedOther:"", free:"" },
      p5:{ next:"", plan:"", free:"" }
    };
  }
  function loadWizDraft(){
    try{ var j = JSON.parse(lsGet(WIZ_DRAFT_KEY) || "null"); return (j && j.data) ? j : null; }catch(e){ return null; }
  }
  function saveWizDraft(){ if(wiz.data) lsSet(WIZ_DRAFT_KEY, JSON.stringify({ step:wiz.step, data:wiz.data })); }
  function clearWizDraft(){ lsDel(WIZ_DRAFT_KEY); }

  function startGuided(){
    var d = loadWizDraft();
    if(d){ wiz.data = d.data; wiz.step = d.step || 1; toast("已恢复上次未写完的内容"); }
    else { wiz.data = blankGuided(); wiz.step = 1; }
    renderWiz();
    switchView("guided");
  }

  function catByKey(k){
    var out = null;
    GUIDED.cats.forEach(function(c){ if(c.key === k) out = c; });
    return out;
  }
  function optHtml(name, value, text, checked){
    return '<label class="opt' + (checked ? " is-checked" : "") + '">' +
      '<input type="radio" name="' + name + '" value="' + esc(value) + '"' + (checked ? " checked" : "") + '>' +
      '<span class="dot" aria-hidden="true"></span><span class="txt">' + esc(text) + '</span></label>';
  }
  function wizQ(n, text){

  }
  function freeSlotHtml(n, val){
    return '<div class="wiz-free"><label>这一步还想记下什么？（可留空）</label>' +
      '<textarea data-g="free' + n + '" placeholder="想到什么写什么，不写也行…">' + esc(val || "") + '</textarea></div>';
  }

  function renderWiz(){
    var n = wiz.step;
    document.getElementById("wizSteps").textContent = "第 " + n + " 步 / 共 5 步";
    document.getElementById("wizBar").style.width = (n / 5 * 100) + "%";

          .map(function(o){ return optHtml("g-energy", o, o, d.p1.energy === o); }).join("") +
        optHtml("g-energy", "__other__", "其他：______", d.p1.energy === "__other__") +
        '</div><div class="other-wrap"' + (d.p1.energy === "__other__" ? "" : " hidden") + ">" +
        '<input type="text" data-g="energyOther" placeholder="写下你的状态" value="' + esc(d.p1.energyOther) + '"></div></div>';
      html += '<div class="q">' + wizQ(2, "我现在最需要的是什么？") + '<div class="opts">' +
        ["恢复精力","获得愉娛和放松","表达自己、创造一些东西","满足好奇心、了解新事物","丰富生活体验","与人建立联系","还不知道"]
          .map(function(o){ return optHtml("g-need", o, o, d.p1.need === o); }).join("") + '</div></div>';
      html += freeSlotHtml(1, d.p1.free);
      return html;
    }

    if(n === 2){
      var rec = GUIDED.needCat[d.p1.need] || "";
      if(!d.p2.cat && rec) d.p2.cat = rec;   // 采用推荐类别（用户可点其他类换成）
      if(rec){

          '</b>——其他类型也可以点开选。自由书写在下面。</li></ul></div>';

        html += '<div class="cat' + (isRec ? " rec" : "") + (isOpen ? " open" : "") + '" data-cat="' + c.key + '">' +

            '<span class="cat-key">' + c.key + '.</span><span>' + esc(c.title) + '</span>' +

    html += '<div class="wiz-free" style="border-top:1px solid var(--line);">' +
      '<h3 class="jrn-title" style="margin-bottom:8px;">给自己的长期提醒</h3>' +

  function wizQs(sel){ var b = document.getElementById("wizBody"); return b ? b.querySelector(sel) : null; }
  function wizVal(sel){ var el = wizQs(sel); return el ? el.value : ""; }
  function wizChecked(name){ var el = wizQs('input[name="' + name + '"]:checked'); return el ? el.value : ""; }

  function collectStep(n){
    var d = wiz.data;
    if(!d) return;
    if(n === 1){
      d.p1.energy = wizChecked("g-energy");
      d.p1.energyOther = wizVal('[data-g="energyOther"]');
      d.p1.need = wizChecked("g-need");
      d.p1.free = wizVal('[data-g="free1"]');
    } else if(n === 2){
      d.p2.sub = wizChecked("g-sub");
      d.p2.subOther = wizVal('[data-g="subOther"]');
      d.p2.tryText = wizVal('[data-g="tryText"]');
      d.p2.free = wizVal('[data-g="free2"]');
      if(!d.p2.cat){
        var openCat = document.querySelector("#wizBody .cat.open");
        if(openCat) d.p2.cat = openCat.getAttribute("data-cat");
      }
    } else if(n === 3){
      d.p3.action = wizVal('[data-g="action"]');
      d.p3.time = wizChecked("g-time");
      d.p3.endCond = wizVal('[data-g="endCond"]');
      d.p3.free = wizVal('[data-g="free3"]');
    } else if(n === 4){
      d.p4.exp = wizVal('[data-g="exp"]');
      d.p4.gain = wizChecked("g-gain");
      d.p4.gainOther = wizVal('[data-g="gainOther"]');
      d.p4.diff = wizVal('[data-g="diff"]');
      d.p4.state = wizVal('[data-g="state"]');
      d.p4.ended = wizChecked("g-ended");
      d.p4.endedOther = wizVal('[data-g="endedOther"]');
      d.p4.free = wizVal('[data-g="free4"]');
    } else if(n === 5){
      d.p5.next = wizChecked("g-next");
      d.p5.plan = wizVal('[data-g="plan"]');
      d.p5.free = wizVal('[data-g="free5"]');
    }
    saveWizDraft();
  }

  (function bindWiz(){
    var body = document.getElementById("wizBody");
    if(!body) return;
    body.addEventListener("change", function(e){
      if(e.target && e.target.type === "radio"){
        var opts = body.querySelectorAll(".opt");
        for(var i=0;i<opts.length;i++){
          var inp = opts[i].querySelector("input");
          opts[i].classList.toggle("is-checked", !!(inp && inp.checked));
        }
        var map = { "g-energy":"energyOther", "g-gain":"gainOther", "g-ended":"endedOther", "g-sub":"subOther" };
        if(e.target.name === "g-sub"){
          var openCat = body.querySelector(".cat.open");
          if(openCat) wiz.data.p2.cat = openCat.getAttribute("data-cat");
        }
        var field = map[e.target.name];
        if(field){
          var inp2 = body.querySelector('[data-g="' + field + '"]');
          if(inp2 && inp2.parentNode && inp2.parentNode.classList.contains("other-wrap")){
            var show = e.target.value === "__other__";
            inp2.parentNode.hidden = !show;
            if(show) setTimeout(function(){ inp2.focus({preventScroll:true}); }, 60);
          }
        }
        collectStep(wiz.step);
      }
    });
    body.addEventListener("input", function(){ collectStep(wiz.step); });
    body.addEventListener("click", function(e){
      var head = e.target.closest("[data-toggle]");
      if(!head) return;
      collectStep(wiz.step);
      var key = head.getAttribute("data-toggle");
      var d = wiz.data;
      var changed = (d.p2.cat !== key);
      d.p2.cat = key;
      var cat = catByKey(key);
      if(changed && cat && d.p2.sub && d.p2.sub !== "__other__" && cat.items.indexOf(d.p2.sub) < 0){
        d.p2.sub = ""; d.p2.subOther = "";
      }
      saveWizDraft();
      body.innerHTML = renderWizStep(2);
    });
  })();

  function wizNextGo(){
    collectStep(wiz.step);
    var n = wiz.step, d = wiz.data;
    if(n === 1){
      if(!d.p1.energy){ toast("先选一下现在的精力状态"); return; }
      if(!d.p1.need){ toast("再选一下你现在最需要什么"); return; }
      var recCat = GUIDED.needCat[d.p1.need] || "";
      if(!d.p2.cat && recCat) d.p2.cat = recCat;
    }
    if(n === 2 && !d.p2.cat){ toast("先点开选一个大类型"); return; }
    if(n < 5){
      wiz.step = n + 1;
      saveWizDraft();
      renderWiz();
    } else {
      saveGuided();
    }
  }
  function wizPrevGo(){
    collectStep(wiz.step);
    if(wiz.step > 1){ wiz.step--; saveWizDraft(); renderWiz(); }
  }

  function saveGuided(){
    var d = wiz.data, A = [];
    function add(q, a){ if(a && String(a).trim()) A.push({ q:q, a:String(a).trim() }); }

    add("第二步 · 我想尝试", d.p2.tryText);

    add("第四步 · 1. 实际体验了什么", d.p4.exp);
    add("第四步 · 2. 带给我什么", d.p4.gain === "__other__" ? ("其他：" + (d.p4.gainOther || "")) : d.p4.gain);
    add("第四步 · 3. 与预期的不同", d.p4.diff);
    add("第四步 · 4. 现在的精力和情绪", d.p4.state);
    add("第四步 · 5. 是否适时结束", d.p4.ended === "__other__" ? ("其他：" + (d.p4.endedOther || "")) : d.p4.ended);
    add("第四步 · 自由书写", d.p4.free);
    add("第五步 · 此刻我更需要", d.p5.next);
    add("第五步 · 下一步我想做", d.p5.plan);

    if(A.length < 3){ toast("至少把第一步填完再保存吧"); return; }

    var entry = { ts:new Date().toISOString(), type:"guided", typeLabel:"分步引导", title:GUIDED.title, answers:A };
    var btn = document.getElementById("wizNext");
    btn.disabled = true; btn.textContent = "保存中…";
    saveRecord(entry).then(function(){
      clearWizDraft();
      wiz.data = blankGuided(); wiz.step = 1;
      document.getElementById("resultCard").innerHTML =
        '<div class="qa-row"><span class="pill">分步引导</span><span class="rec-time" style="margin-left:8px;">' + esc(fmtLong(entry.ts)) + '</span></div>' +
        A.map(function(a){ return '<div class="qa-row"><div class="qa-q">' + esc(a.q) + '</div><div class="qa-a">' + esc(a.a) + '</div></div>'; }).join("") +
        '<div class="qa-row"><div class="qa-q">累计记录</div><div class="qa-a">共 ' + state.records.length + ' 条</div></div>';
      switchView("result");
      toast("已保存，可在记录里看到完整过程");
      renderHome();
    }).catch(function(err){
      toast("保存失败：" + (err.message || "请检查网络"));
    }).then(function(){
      btn.disabled = false; btn.textContent = "保存这次记录";
    });
  }

  function renderQuestions(survey){
    return survey.questions.map(function(q, qi){
      var head = '<div class="qtitle"><span class="qno">' + (qi+1) + '.</span><span>' + esc(q.title) + '</span></div>';
      if(q.options){
        var opts = q.options.map(function(o){
          return '<label class="opt"><input type="radio" name="' + q.id + '" value="' + esc(o) + '">' +
            '<span class="dot" aria-hidden="true"></span><span class="txt">' + esc(o) + '</span></label>';
        }).join("");
        if(q.other){
          opts += '<label class="opt"><input type="radio" name="' + q.id + '" value="__other__">' +
            '<span class="dot" aria-hidden="true"></span><span class="txt">其他：______</span></label>';
          opts += '<div class="other-wrap" data-other="' + q.id + '" hidden>' +
            '<input type="text" class="other-input" data-q="' + q.id + '" placeholder="写下你的答案" /></div>';
        }
        return '<div class="q" data-qid="' + q.id + '">' + head + '<div class="opts" role="radiogroup" aria-label="' + esc(q.title) + '">' + opts + '</div></div>';
      }
      if(q.text){
        var fields = q.text.map(function(f){
          var lab = q.freeSlot ? "" : '<label>' + esc(f.label) + '</label>';
          if(f.multiline){
            return '<div class="tf">' + lab +
              '<textarea class="tall" data-text="' + q.id + '-' + f.id + '" placeholder="' + esc(f.placeholder || '写下来…') + '"></textarea></div>';
          }
          return '<div class="tf">' + lab +
            '<input type="text" data-text="' + q.id + '-' + f.id + '" placeholder="' + esc(f.placeholder || '写下来…') + '" /></div>';
        }).join("");
        return '<div class="q' + (q.freeSlot ? ' q-free' : '') + '" data-qid="' + q.id + '">' + head + '<div class="text-fields">' + fields + '</div></div>';
      }
      return "";
    }).join("");
  }

  function renderJournal(survey){

  /* ================= 提交 ================= */
  var submitBtn = document.getElementById("submitBtn");

  function readQuestion(q){
    if(q.options){
      var picked = surveyForm.querySelector('input[name="' + q.id + '"]:checked');
      if(!picked) return { answered:false };
      var v = picked.value;
      if(q.other && v === "__other__"){
        var inp = surveyForm.querySelector('.other-input[data-q="' + q.id + '"]');
        var extra = inp ? inp.value.trim() : "";
        v = extra ? "其他：" + extra : "其他";
      }
      return { answered:true, value:v };
    }
    if(q.text){
      var parts = [];
      q.text.forEach(function(f){
        var el = surveyForm.querySelector('[data-text="' + q.id + '-' + f.id + '"]');
        var val = el ? el.value.trim() : "";
        if(val) parts.push(f.label + "：" + val);
      });
      if(!parts.length) return { answered:false };
      return { answered:true, value: parts.join("；") };
    }
    return { answered:false };
  }

  submitBtn.addEventListener("click", function(){
    if(state.busy) return;
    var survey = state.current;
    if(!survey){ return; }
    var answers = [], missing = null;

    if(survey.journal){
      survey.sections.forEach(function(s){
        var el = surveyForm.querySelector('[data-journal="' + s.id + '"]');
        var val = el ? el.value.trim() : "";
        if(val) answers.push({ q:s.title, a:val });
      });
      if(!answers.length){ toast("至少写一段再保存吧"); return; }
    }else{
      for(var i=0;i<survey.questions.length;i++){
        var q = survey.questions[i];
        var r = readQuestion(q);
        if(r.answered){
          answers.push({ q:(i+1) + ". " + q.title, a:r.value });
        }else if(q.options && !missing){
          missing = { q:q, idx:i+1 };
          break;
        }
      }
      if(missing){
        toast("第 " + missing.idx + " 题还没选：" + missing.q.title);
        var el = surveyForm.querySelector('[data-qid="' + missing.q.id + '"]');
        if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
        return;
      }
    }

    var entry = {
      ts: new Date().toISOString(),
      type: survey.id,
      typeLabel: survey.typeLabel,
      title: survey.title,
      answers: answers
    };

    state.busy = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "保存中…";
    saveRecord(entry).then(function(){
      var m = counts();
      document.getElementById("resultCard").innerHTML =
        '<div class="qa-row"><span class="pill">' + esc(survey.typeLabel) + '</span>' +
        '<span class="rec-time" style="margin-left:8px;">' + esc(fmtLong(entry.ts)) + '</span></div>' +
        answers.map(function(a){
          return '<div class="qa-row"><div class="qa-q">' + esc(a.q) + '</div><div class="qa-a">' + esc(a.a) + '</div></div>';
        }).join("") +
        '<div class="qa-row"><div class="qa-q">累计记录</div><div class="qa-a">共 ' + state.records.length + ' 条</div></div>';
      switchView("result");
      surveyForm.innerHTML = "";
      state.current = null;
    }).catch(function(err){
      toast("保存失败：" + (err.message || "请检查网络"));
    }).then(function(){
      state.busy = false;
      submitBtn.disabled = false;
      submitBtn.textContent = "提交并保存这次记录";
    });
  });

  /* ================= 数据 ================= */
  function saveRecord(entry){
    if(state.mode === "cloud") return cloudAdd(entry);
    entry.id = "local-" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    state.records.unshift(normalize(entry));
    localWrite(state.records);
    return Promise.resolve(entry);
  }
  function removeRecord(id){
    if(state.mode === "cloud") return cloudDel(id);
    state.records = state.records.filter(function(r){ return String(r.id) !== String(id); });
    localWrite(state.records);
    return Promise.resolve();
  }
  function clearAll(){
    if(state.mode === "cloud") return cloudClear();
    state.records = [];
    localWrite(state.records);
    return Promise.resolve();
  }

  /* ================= 记录列表 ================= */
  function filtered(){
    if(state.filter === "all") return state.records;
    return state.records.filter(function(r){ return r.type === state.filter; });

  /* ================= 导出 ================= */
  function download(name, text, mime){
    try{
      var blob = new Blob([text], {type: mime + ";charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
      return true;
    }catch(e){ return false; }
  }
  function csvCell(v){
    var s = String(v == null ? "" : v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }
  function toCSV(){
    var lines = [["时间","类型","序号","问题","答案"].map(csvCell).join(",")];
    filtered().slice().reverse().forEach(function(r){
      (r.answers || []).forEach(function(a, i){
        lines.push([fmtStamp(r.ts), r.typeLabel || r.type, i+1, a.q, a.a].map(csvCell).join(","));
      });
    });
    return "\ufeff" + lines.join("\r\n") + "\r\n";
  }
  function toJSON(){
    return JSON.stringify({
      exportedAt: new Date().toISOString(),
      count: filtered().length,
      records: filtered()
    }, null, 2);
  }
  function toMarkdown(){
    var rows = filtered();
    var out = ["# 自由时间与生活体验记录", "", "- 导出时间：" + fmtStamp(new Date().toISOString()), "- 记录条数：" + rows.length, ""];
    rows.forEach(function(r, i){
      out.push("## " + (rows.length - i) + ". " + fmtLong(r.ts) + " · " + (r.typeLabel || r.type));
      out.push("");
      (r.answers || []).forEach(function(a){
        out.push("**" + a.q + "**");
        out.push("");
        out.push(a.a.replace(/\n/g, "\n  "));
        out.push("");
      });
    });
    return out.join("\n");
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px";
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy");
        ta.remove();
        ok ? resolve() : reject(new Error("copy failed"));
      }catch(err){ reject(err); }
    });
  }
  document.querySelector(".toolbar").addEventListener("click", function(e){
    var btn = e.target.closest("[data-export]");
    if(!btn) return;
    var kind = btn.getAttribute("data-export");
    if(kind !== "print" && !state.records.length){ toast("还没有记录可导出"); return; }
    if(kind === "csv"){
      download("生活体验记录_" + fileStamp() + ".csv", toCSV(), "text/csv") || toast("导出失败，请换用「复制全部文本」");
      toast("已导出 CSV");
    }else if(kind === "json"){
      download("生活体验记录_" + fileStamp() + ".json", toJSON(), "application/json") || toast("导出失败，请换用「复制全部文本」");
      toast("已导出 JSON");
    }else if(kind === "md"){
      download("生活体验记录_" + fileStamp() + ".md", toMarkdown(), "text/markdown") || toast("导出失败，请换用「复制全部文本」");
      toast("已导出 Markdown");
    }else if(kind === "copy"){
      copyText(toMarkdown()).then(function(){ toast("已复制到剪贴板"); })
        .catch(function(){ toast("复制失败，请改用导出文件"); });
    }else if(kind === "print"){
      window.print();
    }
  });

  /* ================= 配置 / 口令 ================= */
  var setupForm = document.getElementById("setupForm");
  var setupErr = document.getElementById("setupErr");
  var setupBtn = document.getElementById("setupBtn");

  setupForm.addEventListener("submit", function(e){
    e.preventDefault();
    var url = document.getElementById("cfgUrl").value.trim();
    var key = document.getElementById("cfgKey").value.trim();
    var pass = document.getElementById("cfgPass").value;
    setupErr.textContent = "";
    if(!/^https?:\/\/.+/.test(url)){ setupErr.textContent = "请填写完整的 https:// 开头地址"; return; }
    if(key.length < 20){ setupErr.textContent = "key 看起来不完整"; return; }
    if(pass.length < 4){ setupErr.textContent = "口令至少 4 位"; return; }

    var cfg = { url: url, key: key };
    setupBtn.disabled = true; setupBtn.textContent = "测试连接…";
    sbFetch(cfg, "ft_records?select=id&limit=1").then(function(){
      return deriveKey(pass);
    }).then(function(k){
      state.cfg = cfg; state.key = k; state.mode = "cloud";
      lsSet(CFG_KEY, JSON.stringify(cfg));
      lsSet(PASS_KEY, btoa(encodeURIComponent(pass)));
      return cloudList().then(function(r){
        state.records = r.records;
        renderHome(); switchView("home");
        toast("配置完成，已开启云端同步");
      });
    }).catch(function(err){
      if(err.status === 404 || /relation|does not exist/i.test(err.message || "")){
        setupErr.textContent = "连不上数据表：请先在 Supabase 里运行建表 SQL（ft_records）";
      }else if(err.status === 401 || err.status === 403){
        setupErr.textContent = "key 不正确，或未开放匿名访问";
      }else{
        setupErr.textContent = "连接失败：" + (err.message || "请检查 URL 与网络");
      }
    }).then(function(){
      setupBtn.disabled = false; setupBtn.textContent = "保存并开始使用";
    });
  });

  document.getElementById("setupSkip").addEventListener("click", function(){
    state.mode = "local";
    state.records = localRead().map(normalize);
    renderHome(); switchView("home");
    toast("已进入本地模式，记录不会同步");
  });

  var gateForm = document.getElementById("gateForm");
  var gatePass = document.getElementById("gatePass");
  var gateErr = document.getElementById("gateErr");
  var gateBtn = document.getElementById("gateBtn");

  function unlock(pass, remember){
    gateErr.textContent = "";
    gateBtn.disabled = true; gateBtn.textContent = "验证中…";
    return deriveKey(pass).then(function(k){
      state.key = k;
      return cloudList().then(function(r){
        if(r.total > 0 && r.records.length === 0){
          var err = new Error("口令不正确"); err.code = "AUTH"; throw err;
        }
        state.records = r.records;
        if(remember) lsSet(PASS_KEY, btoa(encodeURIComponent(pass)));
        return true;
      });
    }).then(function(){
      gateBtn.disabled = false; gateBtn.textContent = "进入";
      renderHome(); switchView("home");
    }).catch(function(err){
      gateBtn.disabled = false; gateBtn.textContent = "进入";
      state.key = null;
      gateErr.textContent = err.code === "AUTH" ? "口令不正确" : ("连接失败：" + (err.message || "请检查网络"));
    });
  }

  gateForm.addEventListener("submit", function(e){
    e.preventDefault();
    var pass = gatePass.value.trim();
    if(!pass){ gateErr.textContent = "请输入口令"; return; }
    unlock(pass, document.getElementById("rememberPass").checked);
  });

  document.getElementById("gateReset").addEventListener("click", function(){
    if(!confirm("清除本机的 Supabase 配置？下次需要重新填写 URL 和 key（云端记录不会丢失）。")) return;
    lsDel(CFG_KEY); lsDel(PASS_KEY);
    state.cfg = null; state.key = null; state.mode = "local";
    BUILTIN = null;
    hideAll();
    document.getElementById("view-setup").hidden = false;
  });

  /* ================= 启动 ================= */
  var now = new Date();
  document.getElementById("todayLabel").textContent =
    "今天是 " + now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日 " + WD[now.getDay()];

  (function boot(){
    var cfg = readCfg();
    if(!cfg){
      hideAll();
      document.getElementById("view-setup").hidden = false;
      setBadge();
      return;
    }
    state.cfg = cfg;
    state.mode = "cloud";
    if(!hasCrypto()){
      state.mode = "local";
      state.records = localRead().map(normalize);
      renderHome(); switchView("home");
      toast("当前环境不支持加密，已切换到本地模式");
      return;
    }
    var saved = lsGet(PASS_KEY);
    var pass = "";
    if(saved){ try { pass = decodeURIComponent(atob(saved)); } catch(e) { pass = ""; } }
    if(!pass){
      hideAll();
      document.getElementById("view-gate").hidden = false;
      return;
    }
    deriveKey(pass).then(function(k){
      state.key = k;
      return cloudList();
    }).then(function(r){
      if(r.total > 0 && r.records.length === 0){
        state.key = null;
        hideAll();
        document.getElementById("view-gate").hidden = false;
        gateErr.textContent = "记住的口令已失效，请重新输入";
        return;
      }
      state.records = r.records;
      renderHome(); switchView("home");
    }).catch(function(err){
      state.mode = "local";
      state.records = localRead().map(normalize);
      renderHome(); switchView("home");
      toast("云端连接失败，暂用本地模式：" + (err.message || ""));
    });
  })();
})();
</script>
</body>
</html>
